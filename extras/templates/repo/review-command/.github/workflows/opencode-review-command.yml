name: opencode-review-command

on:
  issue_comment:
    types:
      - created

jobs:
  review:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check command and trusted actor
        id: command
        uses: actions/github-script@v7
        env:
          OPENCODE_ALLOWED_USERS: ${{ vars.OPENCODE_ALLOWED_USERS }}
        with:
          script: |
            const body = (context.payload.comment?.body ?? '').trim();
            const match = body.match(/^\/review(?:\s+([\s\S]+))?$/i);

            if (!match) {
              core.setOutput('run', 'false');
              return;
            }

            const association = (context.payload.comment?.author_association ?? '').toUpperCase();
            const trustedAssociations = new Set(['OWNER', 'MEMBER']);
            const allowedUsers = (process.env.OPENCODE_ALLOWED_USERS ?? '')
              .split(',')
              .map((value) => value.trim().toLowerCase())
              .filter(Boolean);
            const actor = (context.actor ?? '').toLowerCase();
            const trustedActor = trustedAssociations.has(association) || allowedUsers.includes(actor);

            core.setOutput('run', trustedActor ? 'true' : 'false');
            core.setOutput('trusted', trustedActor ? 'true' : 'false');

      - name: Explain trusted command policy
        if: steps.command.outputs.trusted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                'OpenCode `/review` only runs for trusted repository members.',
                '',
                'Allowed by default: `OWNER` and `MEMBER` authors.',
                'Optional extra trusted users can be added with the `OPENCODE_ALLOWED_USERS` repository variable.',
              ].join('\n'),
            });

      - name: Checkout repository
        if: steps.command.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Review pull request with OpenCode
        if: steps.command.outputs.run == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          __MODEL_API_KEY_ENV__: ${{ secrets.__MODEL_API_KEY_ENV__ }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: __MODEL__
          agent: review-bot
          use_github_token: true
          prompt: |
            Review this pull request against the repository guidelines.
            The trigger comment may include extra context after `/review`; use it if present.
            Focus on correctness, regressions, structure, and missing tests.
            Be concise and actionable.
