name: Bug report
description: Report a bug that should be fixed
title: "[BUG]: "
labels:
  - bug
assignees:
  - __ISSUE_ASSIGNEE__
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and the impact it had.
      placeholder: Tell us what broke, what you expected, and why it matters.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Share the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: __REPO_NAME__ version
      description: If relevant, share the app version or commit.
      placeholder: e.g. 0.0.1 or a1b2c3d
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share OS, terminal, runtime, and anything else that seems relevant.
      placeholder: e.g. Ubuntu 24.04, Ghostty, Bun 1.3.5
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Logs, screenshots, clips, or anything else that helps.
      placeholder: Paste extra context here.
    validations:
      required: false
