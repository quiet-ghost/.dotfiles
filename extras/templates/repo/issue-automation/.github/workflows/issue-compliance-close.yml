name: issue-compliance-close

on:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  close-stale-noncompliant-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Close stale non-compliant issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- repo-init:issue-automation -->';
            const gracePeriodMs = 2 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'needs:compliance',
              per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) {
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const complianceComment = comments.find((comment) =>
                comment.body?.includes(marker),
              );

              if (!complianceComment) {
                continue;
              }

              const ageMs = Date.now() - new Date(complianceComment.created_at).getTime();
              if (ageMs < gracePeriodMs) {
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  'Closing this issue because the requested intake updates were not added within 2 hours.',
                  '',
                  'If you still need help, open a new issue with the requested details and link back to this one.',
                ].join('\n'),
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
