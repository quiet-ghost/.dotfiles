# Omarchy timer customization

# Use a freedesktop sound theme name, or an absolute path to an audio file.
TIMER_ALARM_SOUND="alarm-clock-elapsed"

# Number of times the sound plays when the timer completes.
TIMER_ALARM_REPEAT=4

# Seconds between repeated alarm sounds.
TIMER_ALARM_INTERVAL=1

# Max seconds to wait for a single sound playback before forcing it to stop.
TIMER_ALARM_PLAY_TIMEOUT=2

# Desktop notification duration in milliseconds.
TIMER_NOTIFICATION_TIMEOUT=10000
