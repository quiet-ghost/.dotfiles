name: opencode-pr-review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Review pull request with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          __MODEL_API_KEY_ENV__: ${{ secrets.__MODEL_API_KEY_ENV__ }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: __MODEL__
          use_github_token: true
          prompt: |
            Review this pull request against the repository guidelines.
            Focus on correctness, regressions, structure, and missing tests.
            Be concise and actionable.
