name: Question
description: Ask a question or request guidance
title: "[QUESTION]: "
labels:
  - question
assignees:
  - __ISSUE_ASSIGNEE__
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Ask the question as clearly as you can.
      placeholder: Explain what is confusing, broken, or blocked.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Share the task, outcome, or workflow you are aiming for.
      placeholder: Describe the goal so maintainers can answer in context.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried or checked already?
      description: Share logs, screenshots, links, or steps you already tried.
      placeholder: Add any extra detail here.
    validations:
      required: false
