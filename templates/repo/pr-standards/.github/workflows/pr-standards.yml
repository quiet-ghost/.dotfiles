name: pr-standards

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

jobs:
  standards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check PR template compliance
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- repo-init:pr-standards -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const title = context.payload.pull_request.title ?? '';
            const body = context.payload.pull_request.body ?? '';

            const managedLabels = {
              'needs:pr-details': 'C2410C',
              'needs:issue': 'B42318',
              'type: bug': 'D73A4A',
              'type: feature': '0E8A16',
              'type: refactor': '5319E7',
              'type: docs': '1D76DB',
              'type: tooling': '6F42C1',
            };

            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                });
              }
            }

            async function addLabel(name) {
              await ensureLabel(name, managedLabels[name]);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [name],
              });
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            function sectionContent(heading) {
              const lines = body.split('\n');
              const sectionHeading = `### ${heading}`;
              const startIndex = lines.findIndex((line) => line.trim() === sectionHeading);

              if (startIndex === -1) {
                return null;
              }

              const content = [];
              for (let index = startIndex + 1; index < lines.length; index += 1) {
                if (lines[index].startsWith('### ')) {
                  break;
                }
                content.push(lines[index]);
              }

              return content.join('\n').trim();
            }

            function stripFormatting(value) {
              return value
                .replace(/[*_`>#-]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            }

            function hasMeaningfulContent(value, boilerplate = []) {
              if (!value) return false;
              let normalized = stripFormatting(value);

              for (const entry of boilerplate) {
                const escaped = entry.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                normalized = normalized.replace(new RegExp(escaped, 'ig'), ' ');
              }

              normalized = normalized.replace(/\s+/g, ' ').trim();
              return normalized.length > 0;
            }

            const findings = [];
            const allowedTitlePrefixes = ['fix', 'feat', 'refactor', 'docs', 'build', 'chore', 'test', 'update'];

            if (title.trim().length < 10) {
              findings.push('- Use a more descriptive pull request title.');
            }

            const titlePrefixMatch = title.match(/^([a-z]+):\s+\S/i);
            const titlePrefix = titlePrefixMatch?.[1]?.toLowerCase() ?? null;

            if (!titlePrefix || !allowedTitlePrefixes.includes(titlePrefix)) {
              findings.push('- Start the PR title with one of `fix:`, `feat:`, `refactor:`, `docs:`, `build:`, `chore:`, `test:`, or `update:`.');
            }

            const requiredSections = [
              'Issue for this PR',
              'Type of change',
              'What does this PR do?',
              'How did you verify your code works?',
              'Screenshots / recordings',
              'Checklist',
            ];

            for (const heading of requiredSections) {
              if (sectionContent(heading) === null) {
                findings.push(`- Add the \`### ${heading}\` section to the pull request body.`);
              }
            }

            const issueSection = sectionContent('Issue for this PR');
            if (issueSection !== null && !/(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#\d+/i.test(issueSection)) {
              findings.push('- Link the PR to an issue using `Closes #123` or `Fixes #123`.');
              await addLabel('needs:issue');
            } else {
              await removeLabel('needs:issue');
            }

            const typeSection = sectionContent('Type of change');
            const typeChecks = [
              { label: 'Bug fix', repoLabel: 'type: bug' },
              { label: 'New feature', repoLabel: 'type: feature' },
              { label: 'Refactor / code improvement', repoLabel: 'type: refactor' },
              { label: 'Documentation', repoLabel: 'type: docs' },
              { label: 'Build / tooling / repo scaffolding', repoLabel: 'type: tooling' },
            ];

            const selectedTypeLabels = [];
            const allowedPrefixesByTypeLabel = {
              'type: bug': ['fix'],
              'type: feature': ['feat'],
              'type: refactor': ['refactor', 'update'],
              'type: docs': ['docs'],
              'type: tooling': ['build', 'chore', 'update'],
            };
            if (typeSection !== null) {
              for (const entry of typeChecks) {
                const regex = new RegExp(`- \\[[xX]\\] ${entry.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`);
                if (regex.test(typeSection)) {
                  selectedTypeLabels.push(entry.repoLabel);
                }
              }

              if (selectedTypeLabels.length === 0) {
                findings.push('- Check at least one item in `### Type of change`.');
              } else if (selectedTypeLabels.length === 1 && titlePrefix) {
                const [selectedTypeLabel] = selectedTypeLabels;
                const allowedPrefixes = allowedPrefixesByTypeLabel[selectedTypeLabel] ?? [];
                if (!allowedPrefixes.includes(titlePrefix)) {
                  findings.push(`- Match the PR title prefix to the selected change type. For this PR, use one of ${allowedPrefixes.map((prefix) => `\`${prefix}:\``).join(', ')}.`);
                }
              }
            }

            for (const entry of typeChecks) {
              if (selectedTypeLabels.includes(entry.repoLabel)) {
                await addLabel(entry.repoLabel);
              } else {
                await removeLabel(entry.repoLabel);
              }
            }

            const descriptionSection = sectionContent('What does this PR do?');
            if (
              descriptionSection !== null &&
              !hasMeaningfulContent(descriptionSection, [
                'Please describe the problem, the changes you made, and why they work.',
                'If there are tradeoffs, follow-ups, or areas you are not fully sure about, call them out clearly so reviewers know where to focus.',
                'If you paste a large clearly AI generated description here your PR may be ignored or closed.',
              ])
            ) {
              findings.push('- Add a real explanation in `### What does this PR do?`.');
            }

            const verificationSection = sectionContent('How did you verify your code works?');
            const verificationNotes = verificationSection === null
              ? null
              : verificationSection.replace(/^- \[[ xX]\] .*$/gm, '').trim();
            if (
              verificationSection !== null &&
              !(/- \[[xX]\]/.test(verificationSection) ||
                hasMeaningfulContent(verificationNotes, [
                  'Add any extra verification details that would help a reviewer trust the change.',
                ]))
            ) {
              findings.push('- Add verification details in `### How did you verify your code works?`.');
            }

            const checklistSection = sectionContent('Checklist');
            if (checklistSection !== null) {
              const requiredChecklistItems = [
                'I have tested my changes locally',
                'I have not included unrelated changes in this PR',
              ];

              for (const item of requiredChecklistItems) {
                const regex = new RegExp(`- \\[[xX]\\] ${item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`);
                if (!regex.test(checklistSection)) {
                  findings.push(`- Check \`${item}\` in \`### Checklist\`.`);
                }
              }
            }

            if (findings.length > 0) {
              await addLabel('needs:pr-details');
            } else {
              await removeLabel('needs:pr-details');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (findings.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const bodyText = [
              marker,
              '## PR standards check',
              '',
              'This PR is missing a few required details:',
              '',
              ...findings,
              '',
              'Update the PR title/body and the check will clear automatically.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: bodyText,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: bodyText,
              });
            }

            core.setFailed('Pull request does not match the required PR template.');
