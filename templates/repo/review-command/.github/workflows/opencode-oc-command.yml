name: opencode-oc-command

on:
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

jobs:
  deep-review:
    if: ${{ github.event.pull_request || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check slash command
        id: command
        uses: actions/github-script@v7
        env:
          OPENCODE_ALLOWED_USERS: ${{ vars.OPENCODE_ALLOWED_USERS }}
        with:
          script: |
            const body = (context.payload.comment?.body ?? '').trim();
            const match = body.match(/^\/(?:oc|opencode)(?:\s+([\s\S]+))?$/i);

            if (!match) {
              core.setOutput('run', 'false');
              return;
            }

            const association = (context.payload.comment?.author_association ?? '').toUpperCase();
            const trustedAssociations = new Set(['OWNER', 'MEMBER']);
            const allowedUsers = (process.env.OPENCODE_ALLOWED_USERS ?? '')
              .split(',')
              .map((value) => value.trim().toLowerCase())
              .filter(Boolean);
            const actor = (context.actor ?? '').toLowerCase();
            const trustedActor = trustedAssociations.has(association) || allowedUsers.includes(actor);

            if (!trustedActor) {
              core.setOutput('run', 'false');
              core.setOutput('trusted', 'false');
              return;
            }

            const trailing = (match[1] ?? '').trim();
            const parts = trailing.length === 0 ? [] : trailing.split(/\s+/);
            const keyword = parts[0]?.toLowerCase() ?? '';
            const followupKeywords = new Set(['followup', 'follow-up', 'issue', 'issues', 'triage']);
            const mode = followupKeywords.has(keyword) ? 'followup' : 'review';

            core.setOutput('run', 'true');
            core.setOutput('mode', mode);
            core.setOutput('trusted', 'true');

      - name: Explain trusted command policy
        if: steps.command.outputs.trusted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number ?? context.payload.pull_request?.number;

            if (!issue_number) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                'OpenCode PR slash commands only run for trusted repository members.',
                '',
                'Allowed by default: `OWNER` and `MEMBER` authors.',
                'Optional extra trusted users can be added with the `OPENCODE_ALLOWED_USERS` repository variable.',
              ].join('\n'),
            });

      - name: Checkout repository
        if: steps.command.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Analyze pull request with OpenCode
        if: steps.command.outputs.run == 'true' && steps.command.outputs.mode == 'review'
        uses: anomalyco/opencode/github@latest
        env:
          __MODEL_API_KEY_ENV__: ${{ secrets.__MODEL_API_KEY_ENV__ }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: __MODEL__
          agent: pr-analyst
          use_github_token: true
          prompt: |
            Take a deeper look at this pull request.

            Treat `/oc` as the maintainer-grade review path:
            - inspect the whole branch, not just the latest diff
            - review the commit history and the combined PR diff
            - focus on correctness, regressions, edge cases, integration risk, and missing tests
            - leave inline PR comments only for concrete file-level findings
            - leave one concise summary comment for maintainers with overall risk, missing coverage, and follow-up recommendations

            Do not edit code in this workflow.
            The trigger comment may include extra context after `/oc` or `/opencode`; use it if present.

      - name: Create follow-up issues with OpenCode
        if: steps.command.outputs.run == 'true' && steps.command.outputs.mode == 'followup'
        uses: anomalyco/opencode/github@latest
        env:
          __MODEL_API_KEY_ENV__: ${{ secrets.__MODEL_API_KEY_ENV__ }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: __MODEL__
          agent: pr-analyst
          use_github_token: true
          prompt: |
            Take a maintainer follow-up pass on this pull request.

            Treat `/oc followup` as the issue-management path:
            - inspect the whole branch, not just the latest diff
            - review the commit history and the combined PR diff
            - identify durable non-blocking follow-up work that should be tracked after merge
            - create GitHub issues only for that durable follow-up work
            - use the repository's existing issue labels and templates when they fit
            - apply the most accurate labels available for each created issue
            - link each new issue back to this pull request
            - assign each issue using `.github/CODEOWNERS` when possible
            - fall back to the repository owner if no owner matches
            - leave one concise summary comment listing the issues you created or clearly say that no follow-up issues were needed

            Do not open placeholder issues.
            Do not edit code in this workflow.
            The trigger comment may include extra context after `/oc followup`; use it if present.

      - name: Explain missing permissions
        if: failure() && steps.command.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number ?? context.payload.pull_request?.number;

            if (!issue_number) {
              core.warning('Unable to resolve PR number for failure comment.');
              return;
            }

            const body = [
              'OpenCode `/oc` ran but could not finish posting results.',
              '',
              'Supported commands:',
              '- `/oc` for deep review',
              '- `/oc followup` for linked follow-up issues, labels, and assignment',
              '',
              'Check the `opencode-oc-command` workflow logs for the exact failure.',
              'Common causes are missing API secrets or insufficient `GITHUB_TOKEN` permissions.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
