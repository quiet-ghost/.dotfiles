general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

# Fallback only if stock /usr/bin/hypridle is started without the launcher.
# NO listeners = no screensaver/lock/dpms on desktop if PATH still wrong.
# Real policy: ~/.local/bin/hypridle-launcher (desktop idle off, laptop 15m+).

# Unreachable no-op so hypridle accepts a zero-policy conf.
listener {
    timeout = 2147483647
    on-timeout = true
}
