# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
     gaps_in = 0
     gaps_out = 0

    # Use master layout instead of dwindle
    # layout = master
}


# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
}

layout {
   # single_window_aspect_ratio = 1 1
}

windowrule = float on, match:class ^(org.omarchy.terminal)$, match:title ^(Timer)$
windowrule = center on, match:class ^(org.omarchy.terminal)$, match:title ^(Timer)$
windowrule = size 875 600, match:class ^(org.omarchy.terminal)$, match:title ^(Timer)$
