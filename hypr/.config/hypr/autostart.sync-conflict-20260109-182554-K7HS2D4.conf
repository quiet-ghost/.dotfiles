# Extra autostart processes
# exec-once = uwsm app -- my-service
# Override default hypridle with our device-aware launcher
exec-once = killall hypridle 2>/dev/null || true; ~/.local/bin/hypridle-launcher
# Automatic TV/laptop display switching
exec-once = ~/.local/bin/hypr-display-monitor

windowrulev2 = workspace 2 silent, class:^(zen)$
windowrulev2 = workspace 1 silent, class:^(legcord)$
windowrulev2 = workspace 4 silent, class:^(jetbrains-idea)$
windowrulev2 = workspace 4 silent, class:^(steam)$
windowrulev2 = workspace 4 silent, class:^(Cursor)$
windowrulev2 = workspace 4 silent, class:^(Code)$
windowrulev2 = workspace 5 silent, class:^(gimp)$
windowrulev2 = workspace 6 silent, class:^(com.github.th_ch.youtube_music)$
windowrulev2 = workspace 7 silent, class:^(Proton Mail)$
windowrulev2 = workspace 8 silent, class:^(com.obsproject.Studio)$
windowrulev2 = workspace 8 silent, class:^(de.feschber.LanMouse)$
windowrulev2 = tile, class:^(Chromium)$

exec-once = $terminal & hyprctl dispatch workspace 3
exec-once = hyprpm reload
exec-once = zen-browser
exec-once = legcord
