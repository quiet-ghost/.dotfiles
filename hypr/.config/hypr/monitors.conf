# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
#monitor=,preferred,auto,auto

xwayland {
  force_zero_scaling = true
}

#Desktop-Main
monitor=desc:Acer Technologies XV272U W2 B5400FDEC4223,2560x1440@240,-2560x0,1 # Left: ASUS horizontal
monitor=desc:Samsung Electric Company Odyssey G81SF HNAY402474,3840x2160@240,0x0,1.5

#Desktop-streaming - Current setup (3 monitors)
monitor=desc:Samsung Electric Company LS28AG700N HCJT903129,3840x2160@144,2393x0,1.5,transform,2  # Middle: Samsung inverted
monitor=desc:Samsung Electric Company LS27FG53x H9DY803455,2560x1440@200,4953x0,1,transform,3  # Right: Samsung portrait vertical

# Streaming layout workspace pins (unused in 2-mon desk; kept for reference)
#workspace = 2, monitor:desc:Samsung Electric Company LS28AG700N HCJT903129, default:true
#workspace = 3, monitor:desc:Samsung Electric Company LS27FG53x H9DY803455, default:true

# Elgato capture card — always mirror Odyssey for recording.
# Hypr still treats it as a real output; hypr-elgato-sanitize keeps workspaces off it.
#monitor=desc:Elgato Systems LLC Elgato 4K X 0x00000001,2560x1440@144,0x0,1,mirror,desc:Samsung Electric Company Odyssey G81SF HNAY402474 # for streaming
monitor=desc:Elgato Systems LLC Elgato 4K X 0x00000001,3840x2160@60,0x0,1,mirror,desc:Samsung Electric Company Odyssey G81SF HNAY402474 # for recording

#Laptop - x1 Carbon (when docked)
monitor=eDP-1,2880x1800@120,0x0,1.8
monitor=desc:Samsung Electric Company SAMSUNG 0x01000E00,3840x2160@60,auto,1.8

# Workspaces — pin 1-10 to real panels only (never Elgato).
# No hypr persistent:true — that keeps empty ws alive and floods waybar.
# Waybar persistent-workspaces only forces 1-3 icons.
# Acer (left): 1, 6-10
workspace = 1, monitor:desc:Acer Technologies XV272U W2 B5400FDEC4223, default:true
workspace = 6, monitor:desc:Acer Technologies XV272U W2 B5400FDEC4223
workspace = 7, monitor:desc:Acer Technologies XV272U W2 B5400FDEC4223
workspace = 8, monitor:desc:Acer Technologies XV272U W2 B5400FDEC4223
workspace = 9, monitor:desc:Acer Technologies XV272U W2 B5400FDEC4223
workspace = 10, monitor:desc:Acer Technologies XV272U W2 B5400FDEC4223

# Odyssey (main): 2-5
workspace = 2, monitor:desc:Samsung Electric Company Odyssey G81SF HNAY402474, default:true
workspace = 3, monitor:desc:Samsung Electric Company Odyssey G81SF HNAY402474
workspace = 4, monitor:desc:Samsung Electric Company Odyssey G81SF HNAY402474
workspace = 5, monitor:desc:Samsung Electric Company Odyssey G81SF HNAY402474


#Gaming
windowrule = fullscreen on, match:title ^(Slay the Spire)$
windowrule = maximize on, match:class ^(SlayTheSpire)$
windowrule = fullscreen on, match:title ^(World of Warcraft)$
windowrule = maximize on, match:class ^(World of Warcraft)$

# Process Killer floating window rules
windowrule = float on, match:class ^(com.mitchellh.ghostty)$, match:title ^(Process Killer)$
windowrule = size 100% 100%, match:class ^(com.mitchellh.ghostty)$, match:title ^(Process Killer)$
windowrule = center on, match:class ^(com.mitchellh.ghostty)$, match:title ^(Process Killer)$

#Yazi floating
windowrule = float off, match:class ^(com.mitchellh.ghostty)$, match:title ^(.*yazi.*)$
windowrule = size 100% 100%, match:class ^(com.mitchellh.ghostty)$, match:title ^(.*yazi.*)$
windowrule = center on, match:class ^(com.mitchellh.ghostty)$, match:title ^(.*yazi.*)$
