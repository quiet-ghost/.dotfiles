general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

# Fallback only. Real policy comes from ~/.local/bin/hypridle-launcher
# (desktop = no timeouts, laptop = 15m screensaver). Keep this empty of
# listeners so a PATH miss never enables the stock 2.5m screensaver.
