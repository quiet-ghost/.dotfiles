# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
#monitor=,preferred,auto,auto

xwayland {
  force_zero_scaling = true
}

#Desktop-Main
monitor=desc:Samsung Electric Company Odyssey G81SF HNAY402474,3840x2160@240,0x0,1.5

#Desktop-streaming - Current setup (3 monitors)
monitor=desc:Ancor Communications Inc ASUS VN247 ECLMTF179420,1920x1080@60,0x0,1  # Left: ASUS horizontal
monitor=desc:Samsung Electric Company LS28AG700N HCJT903129,3840x2160@144,1920x0,1.5,transform,2  # Middle: Samsung inverted
monitor=desc:BNQ BenQ XL2430T C5G06553SL0,1920x1080@144,4480x0,1,transform,1  # Right: BenQ vertical

#Elgato capture card (when connected)
monitor=desc:Elgato Systems LLC Elgato 4K X 0x00000001,2560x1440@144,0x0,1,mirror,DP-1 # for streaming
#monitor=desc:Elgato Systems LLC Elgato 4K X 0x00000001,3840x2160@144,0x0,1,mirror,DP-1 # for recording

#Laptop - x1 Carbon (when docked)
monitor=eDP-1,2880x1800@120,0x0,1.8
monitor=desc:Samsung Electric Company SAMSUNG 0x01000E00,3840x2160@60,auto,1.8

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2



#Gaming
windowrulev2 = fullscreen, title:^(Slay the Spire)$
windowrulev2 = maximize, class:^(SlayTheSpire)$

# Process Killer floating window rules
windowrulev2 = float, class:^(com.mitchellh.ghostty)$, title:^(Process Killer)$
windowrulev2 = size 80% 80%, class:^(com.mitchellh.ghostty)$, title:^(Process Killer)$
windowrulev2 = center, class:^(com.mitchellh.ghostty)$, title:^(Process Killer)$

#Yazi floating
windowrulev2 = float, title:^(yazi)$
windowrulev2 = size 75% 75%, title:^(yazi)$
windowrulev2 = center, title:^(yazi)$

# Java window rules to show title bars
windowrulev2 = plugin:hyprbars:nobar, class:^(zen)$
windowrulev2 = plugin:hyprbars:nobar, class:^(com.mitchellh.ghostty)$
windowrulev2 = plugin:hyprbars:nobar, class:^(legcord)$
windowrulev2 = plugin:hyprbars:nobar, class:^(Chromium)$
windowrulev2 = plugin:hyprbars:nobar, class:^(chromeApp)$
windowrulev2 = plugin:hyprbars:nobar, class:^chrome-.*
windowrulev2 = plugin:hyprbars:nobar, class:^(steam)$
windowrulev2 = plugin:hyprbars:nobar, class:^(jetbrains-idea)$
windowrulev2 = plugin:hyprbars:nobar, class:^(de.feschber.LanMouse)$
windowrulev2 = plugin:hyprbars:nobar, class:^(com.chatterino.chatterino)$
windowrulev2 = plugin:hyprbars:nobar, class:^(com.obsproject.Studio)$
windowrulev2 = plugin:hyprbars:nobar, class:^(org.telegram.desktop)$
windowrulev2 = plugin:hyprbars:nobar, class:^(Omarchy)$


#Window rules for Java applications
windowrulev2 = stayfocused, class:^(com.oracle.javafx.scenebuilder.app.SceneBuilderApp)$
windowrulev2 = nofocus, class:^(com.oracle.javafx.scenebuilder.app.SceneBuilderApp)$, title:^(win.*)
windowrulev2 = stayfocused, class:^(jetbrains-idea)$
windowrulev2 = float, class:^(dev.quietghost.finalproject.J2FP)$
