# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Keyboard layout managed by fcitx5
  # Switch between QWERTY and RPD by clicking the fcitx5 tray icon
  kb_layout = us
  kb_options = ctrl:nocaps
  follow_mouse = 1
  # Change speed of keyboard repeat

  repeat_rate = 40
  repeat_delay = 600

  # Increase sensitity for mouse/trackpack (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true
    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true
    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# Miscellaneous settings (must be OUTSIDE input block)
misc {
  enable_swallow = false
  
  # Enable virtual keyboard support for InputCapture (required for Synergy, remote desktop, etc.)
  # This allows xdg-desktop-portal to create input capture sessions
  # See: https://wiki.hyprland.org/Configuring/Variables/#misc
  vfr = true
  vrr = 0
}
# Scroll faster in the terminal
windowrule = scrolltouchpad 1.5, tag:terminal
